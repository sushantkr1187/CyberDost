version: "3.9"
services:
  kavachti-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kavachti
      POSTGRES_PASSWORD: kavachti_secure_password
      POSTGRES_DB: kavachti_intel
    ports:
      - "5432:5432"
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  kavachti-backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://kavachti:kavachti_secure_password@kavachti-db:5432/kavachti_intel
    depends_on:
      - kavachti-db
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
